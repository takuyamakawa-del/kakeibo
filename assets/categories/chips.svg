<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="ポテトチップス">
  <title>ポテトチップス</title>
  <g stroke="#111" stroke-width="2.4" stroke-linejoin="round">
    <!-- 上の帯 -->
    <path d="M8 6 L92 6 L89 13 L11 13 Z" fill="#df251b"/>
    <!-- 袋の本体（側面が少しくびれている） -->
    <path d="M11 13 L89 13 Q86 30 88 46 Q90 49 88 52 Q85 70 89 88 L11 88 Q15 70 12 52 Q10 49 12 46 Q14 30 11 13 Z" fill="#df251b"/>
    <!-- 下の帯 -->
    <path d="M11 88 L89 88 L92 94 L8 94 Z" fill="#df251b"/>
    <!-- うすしお の帯 -->
    <rect x="20" y="47.5" width="60" height="14" fill="#fdcd28"/>
  </g>
  <!-- 文字（黒ふち付き） -->
  <g font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Meiryo', sans-serif" font-weight="900" text-anchor="middle">
    <g fill="#fff8ee" stroke="#111" stroke-width="3" paint-order="stroke" stroke-linejoin="round">
      <text x="50" y="29" font-size="15">ポテト</text>
      <text x="50" y="44" font-size="15">チップス</text>
    </g>
    <text x="50" y="58.5" font-size="10" fill="#111">うすしお</text>
  </g>
  <!-- チップス -->
  <g stroke="#111" stroke-width="2.2" fill="#fdcd28">
    <ellipse cx="27" cy="75" rx="11" ry="9"/>
    <ellipse cx="74" cy="77" rx="12" ry="8"/>
    <path d="M38 66 Q47 61 56 67 Q63 70 63 77 Q62 85 49 86 Q36 86 34 77 Q33 70 38 66 Z"/>
    <ellipse cx="66" cy="70" rx="9" ry="8" transform="rotate(-20 66 70)"/>
  </g>
  <!-- チップスの点 -->
  <g fill="#111">
    <circle cx="23" cy="72" r="0.9"/><circle cx="29" cy="78" r="0.9"/><circle cx="31" cy="71" r="0.9"/>
    <circle cx="42" cy="72" r="0.9"/><circle cx="49" cy="78" r="0.9"/><circle cx="55" cy="73" r="0.9"/><circle cx="46" cy="83" r="0.9"/>
    <circle cx="64" cy="67" r="0.9"/><circle cx="68" cy="73" r="0.9"/>
    <circle cx="74" cy="80" r="0.9"/><circle cx="80" cy="76" r="0.9"/>
  </g>
</svg>
